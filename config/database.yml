default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: <%= ENV.fetch("DATABASE_PATH", "db/development.sqlite3") %>

test:
  <<: *default
  adapter: sqlite3
  database: <%= ENV.fetch("TEST_DATABASE_PATH", "db/test.sqlite3") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
