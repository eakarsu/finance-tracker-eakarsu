services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_tracker_production
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_tracker -d finance_tracker_production"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://finance_tracker:${POSTGRES_PASSWORD}@db:5432/finance_tracker_production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
